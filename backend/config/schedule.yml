# Recurring background work, loaded by the Sidekiq worker on startup.
purge_trash:
  cron: "30 3 * * *"   # daily at 03:30 UTC, off-peak
  class: PurgeTrashJob
  queue: maintenance
  description: "Permanently delete items past the trash retention window"
purge_held_scans:
  cron: "45 3 * * *"   # daily, just after the trash sweep
  class: PurgeHeldScansJob
  queue: maintenance
  description: "Release photographs from scans nobody came back to finish"
